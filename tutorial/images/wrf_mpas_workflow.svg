<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390">
  <style>
    text { font-family: sans-serif; fill: #172033 } .title { font-size: 24px; font-weight: 700 }
    .label { font-size: 18px; font-weight: 700 } .small { font-size: 15px }
    .wrf { fill: #e9f3ff; stroke: #377eb8; stroke-width: 2 } .mpas { fill: #eaf7ed; stroke: #2f8f46; stroke-width: 2 }
    .arrow { stroke: #555; stroke-width: 2.5; marker-end: url(#a) }
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
  <text x="550" y="32" text-anchor="middle" class="title">同一批 GFS，两个不同的网格世界</text>
  <text x="40" y="78" class="label">WRF：先定义矩形 domain</text>
  <rect x="40" y="100" width="190" height="70" rx="10" class="wrf"/><text x="135" y="128" text-anchor="middle" class="small">geogrid.exe</text><text x="135" y="151" text-anchor="middle" class="small">中心/投影/dx/dy</text>
  <line x1="230" y1="135" x2="285" y2="135" class="arrow"/>
  <rect x="290" y="100" width="150" height="70" rx="10" class="wrf"/><text x="365" y="141" text-anchor="middle" class="small">ungrib.exe</text>
  <line x1="440" y1="135" x2="495" y2="135" class="arrow"/>
  <rect x="500" y="100" width="150" height="70" rx="10" class="wrf"/><text x="575" y="141" text-anchor="middle" class="small">metgrid.exe</text>
  <line x1="650" y1="135" x2="705" y2="135" class="arrow"/>
  <rect x="710" y="100" width="160" height="70" rx="10" class="wrf"/><text x="790" y="129" text-anchor="middle" class="small">wrfinput</text><text x="790" y="151" text-anchor="middle" class="small">wrfbdy</text>
  <line x1="870" y1="135" x2="925" y2="135" class="arrow"/>
  <rect x="930" y="100" width="130" height="70" rx="10" class="wrf"/><text x="995" y="141" text-anchor="middle" class="small">wrf.exe</text>
  <text x="40" y="238" class="label">MPAS-A：先选择已存在的球面网格</text>
  <rect x="40" y="260" width="190" height="70" rx="10" class="mpas"/><text x="135" y="288" text-anchor="middle" class="small">grid.nc</text><text x="135" y="311" text-anchor="middle" class="small">多边形与邻接关系</text>
  <line x1="230" y1="295" x2="285" y2="295" class="arrow"/>
  <rect x="290" y="260" width="150" height="70" rx="10" class="mpas"/><text x="365" y="301" text-anchor="middle" class="small">ungrib.exe</text>
  <line x1="440" y1="295" x2="495" y2="295" class="arrow"/>
  <rect x="500" y="260" width="190" height="70" rx="10" class="mpas"/><text x="595" y="288" text-anchor="middle" class="small">init_atmosphere</text><text x="595" y="311" text-anchor="middle" class="small">static.nc + init.nc</text>
  <line x1="690" y1="295" x2="745" y2="295" class="arrow"/>
  <rect x="750" y="260" width="160" height="70" rx="10" class="mpas"/><text x="830" y="288" text-anchor="middle" class="small">init.nc</text><text x="830" y="311" text-anchor="middle" class="small">全球时无 wrfbdy</text>
  <line x1="910" y1="295" x2="945" y2="295" class="arrow"/>
  <rect x="950" y="260" width="110" height="70" rx="10" class="mpas"/><text x="1005" y="301" text-anchor="middle" class="small">MPAS-A</text>
  <text x="550" y="372" text-anchor="middle" class="small">关键迁移：WPS 仍负责解码；MPAS 自己负责静态场、水平/垂直插值和积分</text>
</svg>
